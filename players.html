<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joueurs - E-Sport CMS</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900">
     <!-- Header -->
<header class="w-full bg-white shadow px-6 py-4 flex justify-end items-center">
    <button onclick="document.getElementById('loginModal').classList.remove('hidden')" class="text-indigo-600 hover:underline font-medium">Se déconnecter</button>
  </header>
  
  <!-- Login Modal -->
  <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg shadow-lg w-full max-w-sm p-6 relative">
      <button onclick="document.getElementById('loginModal').classList.add('hidden')" class="absolute top-2 right-2 text-gray-500 hover:text-gray-800 text-xl">&times;</button>
      <h2 class="text-xl font-semibold mb-4 text-center">Déconnexion</h2>
      <p>Vous êtes déconnecté</p>
    </div>
  </div>
  
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-gray-800 text-white flex flex-col p-4">
      <h1 class="text-2xl font-bold mb-6">🎮 E-Sport CMS</h1>
      <nav class="space-y-3">
        <a href="index.html" class="block hover:text-indigo-400">🏠 Dashboard</a>
        <a href="players.html" class="block font-bold text-indigo-400">🧑‍🤝‍🧑 Joueurs</a>
        <a href="teams.html" class="block hover:text-indigo-400">👥 Équipes</a>
        <a href="jeux.html" class="block hover:text-indigo-400">🕹️ Jeux</a>
        <a href="tournois.html" class="block hover:text-indigo-400">🏆 Tournois</a>
        <a href="matchs.html" class="block hover:text-indigo-400">🎮 Matchs</a>
        <a href="statistiques.html" class="block hover:text-indigo-400">📊 Statistiques</a>
        <a href="setting.html" class="block hover:text-indigo-400">⚙️ Paramètres</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6">
      <h2 class="text-3xl font-semibold mb-6">Les Joueurs</h2>

      <table class="min-w-full bg-white rounded-lg shadow">
        <thead>
          <tr class="bg-gray-200 text-left text-sm font-medium text-gray-700">
            <th class="p-3">Nom</th>
            <th class="p-3">Équipe</th>
            <th class="p-3">Rôle</th>
            <th class="p-3 text-right">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr class="border-t">
            <td class="p-3">Jean Gamer</td>
            <td class="p-3">Team Alpha</td>
            <td class="p-3">DPS</td>
            <td class="p-3 text-right">
              <button class="text-blue-500 hover:underline mr-2">Éditer</button>
              <button class="text-red-500 hover:underline">Supprimer</button>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="mt-6">
        <button onclick="document.getElementById('playerFormModal').classList.remove('hidden')" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">➕ Ajouter un joueur</button>
      </div>

      <!-- Formulaire modal -->
      <div id="playerFormModal" class="hidden fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md">
          <h3 class="text-xl font-semibold mb-4">Ajouter / Éditer un joueur</h3>
          <form class="space-y-4">
            <div>
              <label class="block text-sm font-medium mb-1">Nom</label>
              <input type="text" class="w-full border-gray-300 rounded px-3 py-2" placeholder="Nom du joueur" />
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Équipe</label>
              <select class="w-full border-gray-300 rounded px-3 py-2">
                <option>Team Alpha</option>
                <option>Team Beta</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Rôle</label>
              <select class="w-full border-gray-300 rounded px-3 py-2">
                <option>DPS</option>
                <option>Tank</option>
                <option>Support</option>
                <option>Flex</option>
              </select>
            </div>
            <div class="flex justify-end space-x-2">
              <button type="button" onclick="document.getElementById('playerFormModal').classList.add('hidden')" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Annuler</button>
              <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">Enregistrer</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
