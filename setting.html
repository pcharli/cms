<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paramètres - E-Sport CMS</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900" id="body">
     <!-- Header -->
<header class="w-full bg-white shadow px-6 py-4 flex justify-end items-center">
    <a href="index.html" class="text-indigo-600 hover:underline font-medium">Se connecter</a>
  </header>
  

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-gray-800 text-white flex flex-col p-4">
      <h1 class="text-2xl font-bold mb-6">🎮 E-Sport CMS</h1>
      <nav class="space-y-3">
        <a href="index.html" class="block hover:text-indigo-400">🏠 Dashboard</a>
        <a href="players.html" class="block hover:text-indigo-400">🧑‍🤝‍🧑 Joueurs</a>
        <a href="teams.html" class="block hover:text-indigo-400">👥 Équipes</a>
        <a href="jeux.html" class="block hover:text-indigo-400">🕹️ Jeux</a>
        <a href="tournois.html" class="block hover:text-indigo-400">🏆 Tournois</a>
        <a href="matchs.html" class="block hover:text-indigo-400">🎮 Matchs</a>
        <a href="statistiques.html" class="block hover:text-indigo-400">📊 Statistiques</a>
        <a href="setting.html" class="block font-bold text-indigo-400">⚙️ Paramètres</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 space-y-6">
      <h2 class="text-3xl font-semibold">⚙️ Paramètres</h2>

      <!-- Onglets -->
      <div>
        <div class="flex border-b space-x-4 mb-4">
          <button onclick="showTab('tab-theme', event)" class="tab-button font-medium py-2 px-4 text-gray-600">Personnalisation</button>
        </div>

        <!-- Utilisateurs -->
        

        <!-- Personnalisation -->
        <div id="tab-theme" class="tab-content">
          <h3 class="text-lg font-medium mb-2">Personnalisation</h3>
          <label class="inline-flex items-center">
            <input type="radio" name="theme" value="light" class="form-radio text-indigo-600" checked onchange="switchTheme('light')">
            <span class="ml-2">Mode clair</span>
          </label>
          <label class="inline-flex items-center ml-6">
            <input type="radio" name="theme" value="dark" class="form-radio text-indigo-600" onchange="switchTheme('dark')">
            <span class="ml-2">Mode sombre</span>
          </label>
        </div>

        
      </div>
    </main>
  </div>

  <script>
    function toggleModal(id) {
      const modal = document.getElementById(id);
      modal.classList.toggle('hidden');
    }

    function showTab(tabId, event) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('text-indigo-600', 'border-indigo-500'));
      document.getElementById(tabId).classList.remove('hidden');
      event.target.classList.add('text-indigo-600', 'border-indigo-500');
    }

    function toggleNotifFields(type) {
      document.getElementById('emailField').style.display = (type === 'email') ? 'inline-block' : 'none';
      document.getElementById('smsField').style.display = (type === 'sms') ? 'inline-block' : 'none';
    }

    function switchTheme(theme) {
      const body = document.getElementById('body');
      if (theme === 'dark') {
        body.classList.remove('bg-gray-100', 'text-gray-900');
        body.classList.add('bg-gray-900', 'text-white');
      } else {
        body.classList.remove('bg-gray-900', 'text-white');
        body.classList.add('bg-gray-100', 'text-gray-900');
      }
    }

    // Hide both input fields by default
    toggleNotifFields('none');
  </script>
</body>
</html>
