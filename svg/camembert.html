<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Camembert interactif sans SVG</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }

    .pie-container {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: conic-gradient(
        #3b82f6 0% 25%,     /* 25% */
        #10b981 25% 50%,   /* 25% */
        #f59e0b 50% 75%,   /* 25% */
        #ef4444 75% 100%   /* 25% */
      );
      cursor: pointer;
    }

    .slice-hover {
      position: absolute;
      width: 50%;
      height: 50%;
      top: 50%;
      left: 50%;
      transform-origin: 0% 0%;
      background: transparent;
      pointer-events: auto;
    }

    .tooltip {
      margin-top: 20px;
      padding: 10px 20px;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      display: none;
    }

  </style>
</head>
<body>

<h2>Camembert interactif (HTML/CSS/JS)</h2>

<div class="pie-container" id="pie">
  <!-- 4 zones interactives -->
  <div class="slice-hover" data-label="Bleu (25%)" style="transform: rotate(0deg) skewY(-60deg);"></div>
  <div class="slice-hover" data-label="Vert (25%)" style="transform: rotate(90deg) skewY(-60deg);"></div>
  <div class="slice-hover" data-label="Orange (25%)" style="transform: rotate(180deg) skewY(-60deg);"></div>
  <div class="slice-hover" data-label="Rouge (25%)" style="transform: rotate(270deg) skewY(-60deg);"></div>
</div>

<div class="tooltip" id="tooltip">Info</div>

<script>
  const tooltip = document.getElementById('tooltip');
  const slices = document.querySelectorAll('.slice-hover');

  slices.forEach(slice => {
    slice.addEventListener('mouseenter', () => {
      tooltip.textContent = slice.dataset.label;
      tooltip.style.display = 'block';
    });
    slice.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
    });
    slice.addEventListener('click', () => {
      alert(`Vous avez cliqué sur : ${slice.dataset.label}`);
    });
  });
</script>

</body>
</html>
