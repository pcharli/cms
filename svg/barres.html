<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Graphique à barres simple</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .chart {
      display: flex;
      align-items: flex-end;
      height: 250px;
      gap: 10px;
      border-left: 2px solid #333;
      border-bottom: 2px solid #333;
      padding-left: 20px;
      position: relative;
      max-width: 600px;
      margin-bottom: 40px;
    }
    .bar {
      flex: 1;
      background-color: #3b82f6;
      border-radius: 4px 4px 0 0;
      position: relative;
      transition: background-color 0.3s;
    }
    .bar:hover {
      background-color: #2563eb;
    }
    .bar-label {
      position: absolute;
      bottom: -25px;
      width: 100%;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }
    .bar-value {
      position: absolute;
      top: -25px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #333;
      font-weight: 600;
    }
    /* Y axis labels */
    .y-labels {
      position: absolute;
      left: 0;
      bottom: 0;
      top: 0;
      width: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>

<h2>Graphique à barres simple en HTML/CSS/JS</h2>

<div style="position: relative; max-width: 600px;">
  <div class="y-labels">
    <span>100</span>
    <span>75</span>
    <span>50</span>
    <span>25</span>
    <span>0</span>
  </div>

  <div id="chart" class="chart"></div>
</div>

<script>
  // Données exemple
  const data = [
    { label: 'Jan', value: 40 },
    { label: 'Fév', value: 80 },
    { label: 'Mar', value: 65 },
    { label: 'Avr', value: 90 },
    { label: 'Mai', value: 55 }
  ];

  const chart = document.getElementById('chart');
  const maxValue = 100; // max hauteur (en %)

  data.forEach(item => {
    const bar = document.createElement('div');
    bar.className = 'bar';
    // Hauteur proportionnelle en %
    bar.style.height = (item.value / maxValue * 100) + '%';

    // Valeur au-dessus de la barre
    const valueLabel = document.createElement('div');
    valueLabel.className = 'bar-value';
    valueLabel.textContent = item.value;

    // Label sous la barre
    const label = document.createElement('div');
    label.className = 'bar-label';
    label.textContent = item.label;

    bar.appendChild(valueLabel);
    bar.appendChild(label);
    chart.appendChild(bar);
  });
</script>

</body>
</html>
