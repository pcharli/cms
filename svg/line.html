<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Graphique à courbes sans SVG</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .chart {
      position: relative;
      width: 600px;
      height: 300px;
      border-left: 2px solid #333;
      border-bottom: 2px solid #333;
      margin-top: 40px;
    }

    .point {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #3b82f6;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .line {
      position: absolute;
      height: 2px;
      background: #3b82f6;
      transform-origin: left center;
    }

    .label {
      position: absolute;
      font-size: 12px;
      color: #555;
      transform: translate(-50%, 5px);
    }
  </style>
</head>
<body>

<h2>Graphique à courbes sans SVG</h2>
<div class="chart" id="chart"></div>

<script>
  const data = [
    { label: 'Jan', value: 40 },
    { label: 'Fév', value: 80 },
    { label: 'Mar', value: 65 },
    { label: 'Avr', value: 90 },
    { label: 'Mai', value: 55 }
  ];

  const maxValue = 100;
  const chart = document.getElementById('chart');
  const chartWidth = chart.clientWidth;
  const chartHeight = chart.clientHeight;
  const pointSpacing = chartWidth / (data.length - 1);

  // Convertir les données en coordonnées
  const points = data.map((item, index) => {
    const x = index * pointSpacing;
    const y = chartHeight - (item.value / maxValue) * chartHeight;
    return { x, y, label: item.label, value: item.value };
  });

  // Ajouter les points et labels
  points.forEach((pt, i) => {
    // Point
    const dot = document.createElement('div');
    dot.className = 'point';
    dot.style.left = `${pt.x}px`;
    dot.style.top = `${pt.y}px`;
    chart.appendChild(dot);

    // Label
    const lbl = document.createElement('div');
    lbl.className = 'label';
    lbl.textContent = pt.label;
    lbl.style.left = `${pt.x}px`;
    lbl.style.top = `${chartHeight + 5}px`;
    chart.appendChild(lbl);

    // Ligne vers le prochain point
    if (i < points.length - 1) {
      const next = points[i + 1];
      const dx = next.x - pt.x;
      const dy = next.y - pt.y;
      const length = Math.sqrt(dx * dx + dy * dy);
      const angle = Math.atan2(dy, dx) * (180 / Math.PI);

      const line = document.createElement('div');
      line.className = 'line';
      line.style.width = `${length}px`;
      line.style.left = `${pt.x}px`;
      line.style.top = `${pt.y}px`;
      line.style.transform = `rotate(${angle}deg)`;
      chart.appendChild(line);
    }
  });
</script>

</body>
</html>
