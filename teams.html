<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Équipes - E-Sport CMS</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900">
     <!-- Header -->
<header class="w-full bg-white shadow px-6 py-4 flex justify-end items-center">
    <button onclick="document.getElementById('loginModal').classList.remove('hidden')" class="text-indigo-600 hover:underline font-medium">Se connecter</button>
  </header>
  
  <!-- Login Modal -->
  <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg shadow-lg w-full max-w-sm p-6 relative">
      <button onclick="document.getElementById('loginModal').classList.add('hidden')" class="absolute top-2 right-2 text-gray-500 hover:text-gray-800 text-xl">&times;</button>
      <h2 class="text-xl font-semibold mb-4 text-center">Connexion</h2>
      <form>
        <div class="mb-4">
          <label for="login" class="block text-sm font-medium text-gray-700">Login</label>
          <input type="text" id="login" class="mt-1 w-full border rounded-md px-3 py-2 focus:outline-none focus:ring focus:border-indigo-300" required>
        </div>
        <div class="mb-4">
          <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
          <input type="password" id="password" class="mt-1 w-full border rounded-md px-3 py-2 focus:outline-none focus:ring focus:border-indigo-300" required>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700">Se connecter</button>
      </form>
    </div>
  </div>
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-gray-800 text-white flex flex-col p-4">
      <h1 class="text-2xl font-bold mb-6">🎮 E-Sport CMS</h1>
      <nav class="space-y-3">
        <a href="index.html" class="block hover:text-indigo-400">🏠 Dashboard</a>
        <a href="players.html" class="block hover:text-indigo-400">🧑‍🤝‍🧑 Joueurs</a>
        <a href="teams.html" class="block font-bold text-indigo-400">👥 Équipes</a>
        <a href="jeux.html" class="block hover:text-indigo-400">🕹️ Jeux</a>
        <a href="tournois.html" class="block hover:text-indigo-400">🏆 Tournois</a>
        <a href="matchs.html" class="block hover:text-indigo-400">🎮 Matchs</a>
        <a href="statistiques.html" class="block hover:text-indigo-400">📊 Statistiques</a>
        <a href="setting.html" class="block hover:text-indigo-400">⚙️ Paramètres</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-semibold">👥 Les équipes</h2>
        <button onclick="toggleModal('teamModal')" class="bg-indigo-500 text-white px-4 py-2 rounded">➕ Ajouter une équipe</button>
      </div>

      <!-- Table des équipes -->
      <div class="bg-white rounded shadow p-4">
        <table class="min-w-full table-auto">
          <thead class="bg-gray-200">
            <tr>
              <th class="px-4 py-2 text-left">Nom</th>
              <th class="px-4 py-2 text-left">Coach</th>
              <th class="px-4 py-2 text-left">Créée le</th>
              <th class="px-4 py-2">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr class="border-t">
              <td class="px-4 py-2">Team Alpha</td>
              <td class="px-4 py-2">Julie Martin</td>
              <td class="px-4 py-2">2025-01-15</td>
              <td class="px-4 py-2 text-center">
                <button class="text-blue-500 hover:underline mr-2">Modifier</button>
                <button class="text-red-500 hover:underline">Supprimer</button>
              </td>
            </tr>
            <!-- Équipes supplémentaires ici -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal Ajouter/Modifier Équipe -->
  <div id="teamModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
    <div class="bg-white rounded-lg p-6 w-full max-w-lg">
      <h3 class="text-xl font-semibold mb-4">Ajouter une équipe</h3>
      <form class="space-y-4">
        <div>
          <label class="block mb-1 font-medium">Nom de l'équipe</label>
          <input type="text" class="w-full border rounded px-3 py-2" required />
        </div>
        <div>
          <label class="block mb-1 font-medium">Nom du coach</label>
          <input type="text" class="w-full border rounded px-3 py-2" />
        </div>
        <div class="flex justify-end space-x-2 mt-4">
          <button type="button" onclick="toggleModal('teamModal')" class="px-4 py-2 bg-gray-300 rounded">Annuler</button>
          <button type="submit" class="px-4 py-2 bg-indigo-500 text-white rounded">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function toggleModal(id) {
      const modal = document.getElementById(id);
      modal.classList.toggle('hidden');
    }
  </script>
</body>
</html>
